
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeze Cloud</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101522;color:#fff;font-family:Arial,sans-serif}
header{padding:25px 18px;background:#19243a;text-align:center}
h1{margin:0;color:#7db8ff}
header p{color:#bbc7dc}
main{max-width:850px;margin:auto;padding:18px}
button,.upload{border:0;border-radius:9px;padding:11px 16px;background:#397bd8;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.tabs{display:flex;gap:10px;margin:15px 0}
.tabs button{flex:1}
.panel{background:#1b263a;padding:16px;border-radius:12px;margin-bottom:15px}
input{width:100%;padding:12px;margin:7px 0 12px;border-radius:8px;border:1px solid #52617a;background:#101522;color:white}
.item{background:#25334b;padding:13px;border-radius:10px;margin:12px 0;overflow-wrap:anywhere}
.item video{width:100%;max-height:420px;border-radius:8px;margin-top:10px}
.item a{color:#8fc2ff}
.item button{margin:8px 5px 0 0;background:#b83f4c}
.small{color:#aebbd0;font-size:13px}
.hidden{display:none}
#status{padding:10px;color:#a9d0ff;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<h1>☁️ Zeze Cloud</h1>
<p>Tempat menyimpan dan berbagi video & file</p>
</header>

<main>
<div class="tabs">
<button onclick="showTab('video')">🎬 Video</button>
<button onclick="showTab('file')">📁 File</button>
<button onclick="showTab('admin')">🔐 Admin</button>
</div>

<div id="status">Menghubungkan ke penyimpanan...</div>

<section id="video" class="panel">
<h2>🎬 Video</h2>
<div id="videos">Memuat video...</div>
</section>

<section id="file" class="panel hidden">
<h2>📁 File</h2>
<div id="files">Memuat file...</div>
</section>

<section id="admin" class="panel hidden">
<h2>🔐 Admin</h2>
<div id="loginBox">
<p>Login untuk mengelola isi Zeze Cloud.</p>
<label>Email</label>
<input id="email" type="email" placeholder="Email admin">
<label>Password</label>
<input id="password" type="password" placeholder="Password admin">
<button id="loginBtn" onclick="login()">Login</button>
</div>

<div id="adminBox" class="hidden">
<p>Login admin berhasil.</p>
<p class="small">Pilih video atau file yang ingin diunggah.</p>
<input id="uploadInput" type="file">
<button id="uploadBtn" onclick="uploadFile()">⬆️ Upload</button>
<button onclick="logout()">Logout</button>
</div>
</section>
</main>

<script>
const URL = "https://ahmiscuwoyenpnjfdwlw.supabase.co";
const KEY = "sb_publishable_MVea74GSrSWxVnANrsdm-Q_pX5EmYwE";
const BUCKET = "zeze-video-file";
const ADMIN_UID = "4b1a64a0-32f5-428a-a197-d0fec344c66d";

const db = window.supabase.createClient(URL, KEY);
let currentUser = null;

function status(message){
 document.getElementById("status").textContent = message;
}

function showTab(tab){
 ["video","file","admin"].forEach(id=>{
  document.getElementById(id).classList.toggle("hidden",id!==tab);
 });
}

function safeName(name){
 return name.replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

async function loadFiles(){
 const videoBox=document.getElementById("videos");
 const fileBox=document.getElementById("files");

 videoBox.textContent="Memuat video...";
 fileBox.textContent="Memuat file...";

 const {data,error}=await db.storage.from(BUCKET).list("",{
  limit:100,
  sortBy:{column:"created_at",order:"desc"}
 });

 if(error){
  videoBox.textContent="Gagal memuat: "+error.message;
  fileBox.textContent="Gagal memuat: "+error.message;
  return;
 }

 videoBox.innerHTML="";
 fileBox.innerHTML="";

 if(!data || data.length===0){
  videoBox.textContent="Belum ada video.";
  fileBox.textContent="Belum ada file.";
  return;
 }

 let videoCount=0,fileCount=0;

 data.forEach(file=>{
  if(!file.name || file.name.startsWith("."))return;

  const {data:publicData}=db.storage.from(BUCKET).getPublicUrl(file.name);
  const url=publicData.publicUrl;
  const type=(file.metadata?.mimetype || file.metadata?.contentType || "").toLowerCase();
  const isVideo=type.startsWith("video/") || /\.(mp4|webm|mov|m4v|ogv)$/i.test(file.name);

  const item=document.createElement("div");
  item.className="item";

  const title=document.createElement("strong");
  title.textContent=file.name;
  item.appendChild(title);

  if(isVideo){
   videoCount++;
   const player=document.createElement("video");
   player.controls=true;
   player.preload="metadata";
   player.src=url;
   item.appendChild(player);
  }else{
   fileCount++;
   const link=document.createElement("a");
   link.href=url+"?download";
   link.textContent="⬇️ Download file";
   link.target="_blank";
   link.rel="noopener";
   item.appendChild(document.createElement("br"));
   item.appendChild(link);
  }

  if(currentUser && currentUser.id===ADMIN_UID){
   const del=document.createElement("button");
   del.textContent="Hapus";
   del.onclick=()=>deleteFile(file.name);
   item.appendChild(del);
  }

  (isVideo?videoBox:fileBox).appendChild(item);
 });

 if(!videoCount)videoBox.textContent="Belum ada video.";
 if(!fileCount)fileBox.textContent="Belum ada file.";
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const btn=document.getElementById("loginBtn");

 if(!email || !password){
  status("Masukkan email dan password.");
  return;
 }

 btn.disabled=true;
 btn.textContent="Sedang masuk...";
 status("Menghubungkan akun...");

 try{
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error)throw error;

  if(data.user.id!==ADMIN_UID){
   await db.auth.signOut();
   throw new Error("Akun ini bukan admin Zeze Cloud.");
  }

  currentUser=data.user;
  updateAdmin();
  status("Login admin berhasil.");
  await loadFiles();
 }catch(e){
  status("Login gagal: "+e.message);
 }finally{
  btn.disabled=false;
  btn.textContent="Login";
 }
}

function updateAdmin(){
 const isAdmin=currentUser && currentUser.id===ADMIN_UID;
 document.getElementById("loginBox").classList.toggle("hidden",!!isAdmin);
 document.getElementById("adminBox").classList.toggle("hidden",!isAdmin);
}

async function logout(){
 await db.auth.signOut();
 currentUser=null;
 updateAdmin();
 status("Kamu sudah logout.");
 await loadFiles();
}

async function uploadFile(){
 const input=document.getElementById("uploadInput");
 const btn=document.getElementById("uploadBtn");
 const file=input.files[0];

 if(!currentUser || currentUser.id!==ADMIN_UID){
  status("Login admin diperlukan.");
  return;
 }
 if(!file){
  status("Pilih file terlebih dahulu.");
  return;
 }

 btn.disabled=true;
 status("Mengunggah file...");

 try{
  const safeFile=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const path=Date.now()+"_"+safeFile;

  const {error}=await db.storage.from(BUCKET).upload(path,file,{
   cacheControl:"3600",
   upsert:false,
   contentType:file.type || "application/octet-stream"
  });

  if(error)throw error;

  status("Upload berhasil!");
  input.value="";
  await loadFiles();
 }catch(e){
  status("Upload gagal: "+e.message);
 }finally{
  btn.disabled=false;
 }
}

async function deleteFile(name){
 if(!currentUser || currentUser.id!==ADMIN_UID)return;
 if(!confirm("Yakin ingin menghapus "+name+"?"))return;

 status("Menghapus file...");
 const {error}=await db.storage.from(BUCKET).remove([name]);

 if(error){
  status("Gagal menghapus: "+error.message);
  return;
 }

 status("File berhasil dihapus.");
 await loadFiles();
}

async function start(){
 try{
  const {data,error}=await db.auth.getSession();
  if(error)throw error;

  currentUser=data.session?.user || null;

  if(currentUser && currentUser.id!==ADMIN_UID){
   await db.auth.signOut();
   currentUser=null;
  }

  updateAdmin();
  status("Terhubung. Memuat daftar file...");
  await loadFiles();
 }catch(e){
  status("Koneksi gagal: "+e.message);
 }
}

db.auth.onAuthStateChange((event,session)=>{
 currentUser=session?.user || null;
 if(currentUser && currentUser.id!==ADMIN_UID){
  currentUser=null;
 }
 updateAdmin();
});

start();
</script>
</body>
</html>
